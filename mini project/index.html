<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing Page</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .api {
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            min-height: 24px;
        }

        .api.error {
            color: red;
        }

        .api.success {
            color: green;
        }

        .product-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .product-card {
            background-color: #dbdcc6;
            border: 1px solid #859edd;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .product-id {
            font-size: 12px;
            color: #777;
            margin-bottom: 4px;
        }

        .product-title {
            font-size: 16px;
            font-weight: bold;
            color: #222;
            margin-bottom: 8px;
        }

        .product-price {
            font-size: 18px;
            color: #27ae60;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .product-description {
            font-size: 14px;
            color: #555;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>Product Listing</h1>
    
    <!-- Container to display API status and errors -->
    <div class="api"></div>

    <!-- Container to hold the product cards -->
    <div class="product-container"></div>

    <script src="script.js"></script>
</body>
</html>
